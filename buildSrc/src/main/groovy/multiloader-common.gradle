plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "DecorativeBlocks-Reborn-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.withType(Javadoc).configureEach {
    // Javadoc on mod code is noisy and not published anywhere
    enabled = false
}

tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

// Disables Gradle's custom module metadata from being published to maven.
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

sourcesJar {
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                         : version,
            'group'                           : project.group, //Else we target the task's group.
            'minecraft_version'               : minecraft_version,
            'minecraft_neoforge_version_range': minecraft_neoforge_version_range,
            'minecraft_fabric_version_range'  : minecraft_fabric_version_range,
            'fabric_version'                  : fabric_version,
            'fabric_loader_version'           : fabric_loader_version,
            'neoforge_version'                : neoforge_version,
            'mod_name'                        : mod_name,
            'mod_author'                      : mod_author,
            'mod_id'                          : mod_id,
            'mod_license'                     : mod_license,
            'mod_description'                 : mod_description,
            'soul_fire_d_version'             : soul_fire_d_version,
            'java_version'                    : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
